name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: corepack prepare yarn@4.18.0 --activate
      - run: yarn install --mode=update-lockfile
      - name: Commit resolved lockfile
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          if ! git diff --quiet -- yarn.lock; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add yarn.lock
            git commit -m "build: update Yarn lockfile [skip ci]"
            git push
          fi
      - run: yarn install --immutable
      - run: yarn format:check
      - run: yarn check
      - run: yarn test
      - name: Smoke-test API development runtime
        run: |
          yarn workspace @storyteller/api tsx src/index.ts > /tmp/storyteller-api.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent http://localhost:3001/health > /dev/null; then
              exit 0
            fi
            if ! kill -0 "$api_pid" 2>/dev/null; then
              cat /tmp/storyteller-api.log
              exit 1
            fi
            sleep 0.5
          done
          cat /tmp/storyteller-api.log
          exit 1
      - run: yarn workspace @storyteller/web vite build
